<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipboard Orbit — feedback</title>
<style>
  :root {
    --bg: #F7F9FC;
    --ink: #0F2B46;
    --muted: #5B7186;
    --accent: #1F6FEB;
    --line: #D8E1EA;
    --sans: -apple-system, "Segoe UI", "Noto Sans", "DejaVu Sans", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.6;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 30px 30px 24px;
  }
  h1 { font-size: 24px; margin: 0 0 8px; letter-spacing: -0.01em; }
  .lead { margin: 0 0 22px; color: var(--muted); font-size: 15px; }
  .q { font-size: 16px; font-weight: 650; margin: 0 0 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chip {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    border-radius: 999px;
    padding: 7px 14px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] {
    border-color: var(--accent);
    background: #EAF2FE;
    color: var(--accent);
  }
  textarea {
    width: 100%;
    min-height: 92px;
    resize: vertical;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 10px 12px;
    font: inherit;
    font-size: 14.5px;
    color: var(--ink);
  }
  textarea:focus { outline: 2px solid #BFD6FB; border-color: var(--accent); }
  .actions { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .send {
    border: 0;
    background: var(--accent);
    color: #fff;
    border-radius: 8px;
    padding: 10px 18px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .send:disabled { opacity: 0.55; cursor: default; }
  .status { font-size: 13.5px; color: var(--muted); }
  .status.err { color: #B3261E; }
  .hidden { display: none; }
</style>
</head>
<body>
<main class="card">
  <h1 data-i18n="title">Sorry to see you go</h1>
  <p class="lead" data-i18n="lead">One question — it helps us fix what broke.</p>

  <p class="q" data-i18n="question">Why have you deleted the app?</p>
  <div class="chips" id="chips">
    <button type="button" class="chip" data-reason="bug" aria-pressed="false" data-i18n="reasonBug">Something didn't work</button>
    <button type="button" class="chip" data-reason="missing" aria-pressed="false" data-i18n="reasonMissing">Missing a feature</button>
    <button type="button" class="chip" data-reason="slow" aria-pressed="false" data-i18n="reasonSlow">Too slow</button>
    <button type="button" class="chip" data-reason="alternative" aria-pressed="false" data-i18n="reasonAlt">Found an alternative</button>
    <button type="button" class="chip" data-reason="other" aria-pressed="false" data-i18n="reasonOther">Other</button>
  </div>

  <textarea id="details" data-i18n-placeholder="detailsPlaceholder" placeholder="Anything else? (optional)"></textarea>

  <div class="actions">
    <button type="button" class="send" id="send" data-i18n="send">Send</button>
    <span class="status" id="status"></span>
  </div>

  <p class="status hidden" id="thanks" data-i18n="thanks">Thanks — we read every answer.</p>
</main>

<script>
(function () {
  // FormSubmit email link (https://formsubmit.co/el/…). Its AJAX endpoint needs a
  // real mailbox in the URL, so the page hands the answer over to the FormSubmit
  // send page instead of posting it from here.
  const FEEDBACK_ENDPOINT = 'https://formsubmit.co/el/varofa';

  const DICT = {
    en: {
      title: 'Sorry to see you go',
      lead: 'One question — it helps us fix what broke.',
      question: 'Why have you deleted the app?',
      reasonBug: "Something didn't work",
      reasonMissing: 'Missing a feature',
      reasonSlow: 'Too slow',
      reasonAlt: 'Found an alternative',
      reasonOther: 'Other',
      detailsPlaceholder: 'Anything else? (optional)',
      send: 'Send',
      thanks: 'Thanks — we read every answer.',
      needReason: 'Pick a reason first.',
      sending: 'Sending…',
      failed: 'Could not send. Please try again.',
      notConnected: 'Feedback endpoint is not configured.',
      openLink: 'The send page opened in a new tab — press Send there.'
    },
    ru: {
      title: 'Жаль, что вы ушли',
      lead: 'Один вопрос — он поможет понять, что сломалось.',
      question: 'Почему вы удалили расширение?',
      reasonBug: 'Что-то не работало',
      reasonMissing: 'Не хватило функции',
      reasonSlow: 'Слишком медленно',
      reasonAlt: 'Нашёл альтернативу',
      reasonOther: 'Другое',
      detailsPlaceholder: 'Что-то ещё? (необязательно)',
      send: 'Отправить',
      thanks: 'Спасибо — мы читаем все ответы.',
      needReason: 'Сначала выберите причину.',
      sending: 'Отправляем…',
      failed: 'Не удалось отправить. Попробуйте ещё раз.',
      notConnected: 'Форма обратной связи ещё не подключена.',
      openLink: 'Страница отправки открылась в новой вкладке — нажмите там «Отправить».'
    }
  };

  const lang = (navigator.language || 'en').toLowerCase().startsWith('ru') ? 'ru' : 'en';
  const t = DICT[lang];
  document.documentElement.lang = lang;

  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const key = el.getAttribute('data-i18n');
    if (t[key]) el.textContent = t[key];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (t[key]) el.placeholder = t[key];
  });

  let reason = '';
  let reasonLabel = '';
  document.getElementById('chips').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    reason = chip.dataset.reason;
    reasonLabel = (chip.textContent || '').trim();
    document.querySelectorAll('.chip').forEach((c) => {
      c.setAttribute('aria-pressed', String(c === chip));
    });
  });

  const send = document.getElementById('send');
  const status = document.getElementById('status');
  const thanks = document.getElementById('thanks');

  send.addEventListener('click', async () => {
    status.classList.remove('err');
    if (!reason) {
      status.textContent = t.needReason;
      status.classList.add('err');
      return;
    }
    if (!FEEDBACK_ENDPOINT) {
      status.textContent = t.notConnected;
      status.classList.add('err');
      return;
    }
    send.disabled = true;
    status.textContent = t.sending;
    const details = document.getElementById('details').value.trim();
    const message = [
      'Reason: ' + (reasonLabel || reason),
      details ? 'Details: ' + details : '',
      'Language: ' + lang,
      'Source: uninstall',
      'Time: ' + new Date().toISOString()
    ].filter(Boolean).join('\n');
    const url = FEEDBACK_ENDPOINT.replace(/\/$/, '') +
      '?subject=' + encodeURIComponent('Clipboard Orbit — uninstall feedback') +
      '&message=' + encodeURIComponent(message.slice(0, 1200));
    window.open(url, '_blank', 'noopener');
    status.textContent = t.openLink;
    document.getElementById('chips').classList.add('hidden');
    document.getElementById('details').classList.add('hidden');
    send.classList.add('hidden');
    thanks.classList.remove('hidden');
  });
})();
</script>
</body>
</html>
